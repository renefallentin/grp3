site_name: H1 Serverprojekt
site_url: https://renefallentin.github.io/grp3/

nav:
  - Home: index.md
  - Basic Configuration: basicconfig.md

theme:
  name: material
  font: 
    - text: merriweather sans-serif
      code: red hat mono
  icon:
    logo: fontawesome/solid/3
  palette:
    - scheme: slate
      primary: lime
      accent: deep-purple

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css