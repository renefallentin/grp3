site_name: My Documentation
site_url: https://renefallentin.github.io/grp3/

nav:
  - Home: index.md
  - Getting Started: getting-started.md

theme:
  name: material
  font: 
    text: merriweather sans-serif
    code: red hat mono
  icon:
    logo: fontawesome/solid/3
  palette:
    - scheme: slate
    - primary: green
      accent: deep-purple

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences